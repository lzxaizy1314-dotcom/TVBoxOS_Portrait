name: Test Build

on:
  push:
    branches:
      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build & publish DLNA-Cast to mavenLocal
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/devin1014/DLNA-Cast.git /tmp/DLNA-Cast
          chmod +x /tmp/DLNA-Cast/gradlew
          cd /tmp/DLNA-Cast
          ./gradlew :dlna-core:publishToMavenLocal :dlna-dmc:publishToMavenLocal --no-daemon -x lint
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            mv "$file" ${{ github.workspace }}/apk/
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc_${{ github.run_number }}
          path: ${{ github.workspace }}/apk/*
